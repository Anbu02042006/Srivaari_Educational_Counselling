
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Top arc: left to right over top -->
    <path id="top-arc" d="M 22,100 A 78,78 0 1,1 178,100" fill="none" />
    <!-- Bottom arc: left to right along bottom, but with side="right" or standard SVG 2 path -->
    <!-- If we want text to read left-to-right along bottom upright:
         The path must go from left to right: M 26,108 A 74,74 0 0,0 174,108
         With path going left to right (sweep 0), left side of direction is inwards (toward center).
         So baseline is on arc, top of letters point toward center!
    -->
    <path id="bottom-arc" d="M 26,100 A 74,74 0 0,0 174,100" fill="none" />
  </defs>

  <!-- Outer circle with subtle drop shadow -->
  <circle cx="100" cy="100" r="97" fill="#ffffff" stroke="#0a2558" stroke-width="3.5" />
  
  <!-- Outer track guide line -->
  <circle cx="100" cy="100" r="69" fill="none" stroke="#0a2558" stroke-width="1.5" />

  <!-- Top Text: SRI VAARI -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#0a2558" letter-spacing="2">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      SRI VAARI
    </textPath>
  </text>

  <!-- Bottom Text: EDUCATIONAL GROUPS -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="12" fill="#0a2558" letter-spacing="1">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      EDUCATIONAL GROUPS
    </textPath>
  </text>

  <!-- Inner Blue Disc -->
  <circle cx="100" cy="100" r="67" fill="#2563eb" />
</svg>
