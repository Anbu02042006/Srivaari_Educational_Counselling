<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e48"/>
      <stop offset="100%" stop-color="#163777"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <path id="textCircleTop" d="M 60,200 A 140,140 0 1,1 340,200" fill="none" />
    <path id="textCircleBottom" d="M 340,200 A 140,140 0 0,1 60,200" fill="none" />
  </defs>

  <!-- Outer Shadow & Rings -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="200" cy="200" r="130" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Curved Text -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="900" fill="#fef3c7" letter-spacing="2.2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      ATAL BIHARI VAJPAYEE
    </textPath>
  </text>
  
  <text font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="800" fill="#fef3c7" letter-spacing="1.5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      SEC. &amp; HIGHER SEC. EDUCATION
    </textPath>
  </text>

  <!-- Stars on Ring -->
  <g fill="url(#goldGrad)">
    <polygon points="48,200 52,190 62,190 54,196 57,206 48,200 39,206 42,196 34,190 44,190" transform="translate(10, 0) scale(0.7)"/>
    <polygon points="342,200 346,190 356,190 348,196 351,206 342,200 333,206 336,196 328,190 338,190" transform="translate(100, 0) scale(0.7)"/>
  </g>

  <!-- Inner Center Graphic: Open Book, Torch & Laurel -->
  <g transform="translate(200, 200)">
    <!-- Laurel Wreath -->
    <path d="M-80,10 C-85,-30 -60,-65 -20,-75 C-25,-60 -45,-30 -40,10 Z" fill="#f59e0b" opacity="0.85"/>
    <path d="M80,10 C85,-30 60,-65 20,-75 C25,-60 45,-30 40,10 Z" fill="#f59e0b" opacity="0.85"/>
    
    <!-- Open Book Base -->
    <path d="M-55,25 Q-25,15 0,22 Q25,15 55,25 L50,45 Q25,36 0,42 Q-25,36 -50,45 Z" fill="#0f2b5c"/>
    <path d="M-52,22 Q-25,12 0,20 L0,38 Q-25,32 -48,40 Z" fill="#ffffff"/>
    <path d="M52,22 Q25,12 0,20 L0,38 Q25,32 48,40 Z" fill="#ffffff"/>
    <line x1="0" y1="20" x2="0" y2="40" stroke="#0f2b5c" stroke-width="2"/>

    <!-- Knowledge Sun Rays / Flame -->
    <path d="M0,-35 Q-12,-15 0,5 Q12,-15 0,-35 Z" fill="#d97706"/>
    <path d="M0,-28 Q-7,-12 0,5 Q7,-12 0,-28 Z" fill="#fbbf24"/>

    <!-- Graduation Cap -->
    <polygon points="0,-48 42,-34 0,-20 -42,-34" fill="#0b1e48"/>
    <polygon points="0,-45 38,-34 0,-23 -38,-34" fill="#1e3a8a"/>
    <rect x="-18" y="-32" width="36" height="12" rx="4" fill="#0b1e48"/>
    <!-- Tassel -->
    <path d="M0,-34 Q25,-32 32,-15" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="32" cy="-14" r="3" fill="#f59e0b"/>

    <!-- Motto Ribbon -->
    <rect x="-60" y="52" width="120" height="20" rx="4" fill="#0b1e48"/>
    <text x="0" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="900" fill="#fef3c7" letter-spacing="1">
      EXCELLENCE IN EDUCATION
    </text>
  </g>
</svg>
